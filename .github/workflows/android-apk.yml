name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        run: pnpm --dir apps/mobile exec expo prebuild --platform android --no-install

      - name: Build standalone release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify standalone bundle and APK
        run: |
          test -f apps/mobile/android/app/build/generated/assets/createBundleReleaseJsAndAssets/index.android.bundle
          test -s apps/mobile/android/app/build/generated/assets/createBundleReleaseJsAndAssets/index.android.bundle
          test -f apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          test -s apps/mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk artifacts/OpenMuse-standalone-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenMuse-Standalone-APK
          path: artifacts/OpenMuse-standalone-release.apk
          if-no-files-found: error
